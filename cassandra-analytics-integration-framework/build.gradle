plugins {
    id('java-library')
    id('maven-publish')
}

java {
    withJavadocJar()
    withSourcesJar()
}

if (propertyWithDefault("artifactType", null) == "spark")
{
    apply from: "$rootDir/gradle/common/publishing.gradle"
}

ext.dtestJar = System.getenv("DTEST_JAR") ?: "dtest-5.0.7.jar" // latest supported Cassandra build is 5.0
def dtestJarFullPath = "${dependencyLocation}${ext.dtestJar}"

test {
    useJUnitPlatform()
}

dependencies {
    // These dependencies (sidecar + dtest jars) must be built by running `scripts/build-dependencies.sh`
    implementation(group: 'org.apache.cassandra', name: 'sidecar-adapters-base', version: "${sidecarVersion}")
    implementation(group: 'org.apache.cassandra', name: 'sidecar-adapters-cassandra41', version: "${sidecarVersion}")

    File dtestJarFile = new File(dtestJarFullPath)
    println("Using DTest jar: " + dtestJarFullPath + "; present? " + dtestJarFile.exists())
    // The dtest jar must be a compile only dependency. We want to avoid having this jar in the
    // classpath while running integration tests. Instead, a dedicated classloader will load the
    // dtest jar while provisioning the in-jvm dtest Cassandra cluster
    compileOnly(files("${dtestJarFullPath}"))
    api("org.apache.cassandra:dtest-api:0.0.18")
    // Needed by the Cassandra dtest framework
    // JUnit
    api("org.junit.jupiter:junit-jupiter-api:${project.junitVersion}")
    api("org.junit.jupiter:junit-jupiter-params:${project.junitVersion}")
    api("org.junit.jupiter:junit-jupiter-engine:${project.junitVersion}")

    api("org.junit.vintage:junit-vintage-engine:${junitVersion}")
    api('org.mockito:mockito-inline:4.10.0')
    api("org.assertj:assertj-core:${assertjCoreVersion}")

    api('com.datastax.cassandra:cassandra-driver-core:3.11.3')
    implementation('com.google.inject:guice:7.0.0')

    implementation("com.google.guava:guava:31.0.1-jre")
    api("io.vertx:vertx-web:${project.vertxVersion}") {
        exclude group: 'junit', module: 'junit'
    }
    implementation("io.vertx:vertx-web-client:${project.vertxVersion}")
    implementation(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.14.3')

    // Bouncycastle dependencies for test certificate provisioning
    implementation(group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78')
    implementation(group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.78')

    testImplementation(platform("org.junit:junit-bom:${project.junitVersion}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation("org.assertj:assertj-core:${assertjCoreVersion}")

    // Exposed to the test project
    api("io.vertx:vertx-junit5:${project.vertxVersion}")
    // The server itself
    api(group: "org.apache.cassandra", name: "sidecar-server", version: "${sidecarVersion}") {
        exclude(group: 'org.apache.logging.log4j')
        exclude(group: 'org.slf4j')
        exclude(group: 'ch.qos.logback')
        // kafka-avro-serializer is only needed when sidecar publishes CDC events to a
        // Schema-Registry-backed Kafka topic, which our in-jvm integration tests do not exercise.
        exclude(group: 'io.confluent')
        // Sidecar declares runtime dependencies on *published* artifacts of this very repo. A project
        // dependency's identity is project.group + project.name, never archivesBaseName, and
        // gradle/common/publishing-spark.gradle appends _spark<N>_<scala> to archivesBaseName - so the
        // published artifactIds match no project.name here, Gradle cannot dedupe them against the local
        // projects, and a stale copy of every class sits on the test classpath next to the locally built
        // output. Either copy can win class loading (IntelliJ orders entries differently from Gradle),
        // so recent changes silently vanish at integration-test runtime with no warning at build time.
        //
        // The suffix records the Spark/Scala profile *sidecar* was published with, not the one we build
        // against, so it cannot be derived from sparkLabel/scalaMajorVersion - a computed suffix matches
        // nothing and fails silently. Hardcode it.
        //
        // cassandra-analytics-common needs no exclude: it publishes unsuffixed, so its coordinates match
        // the local project and Gradle resolves the conflict in favour of the project.
        //
        // Excluding alone is not enough. Sidecar's own code loads these classes - SidecarModules.all()
        // reaches org.apache.cassandra.cdc.sidecar.ClusterConfigProvider during startup - so dropping the
        // published jars without putting the local equivalents on the classpath yields
        // NoClassDefFoundError. The matching project(...) dependencies are declared below; keep the two
        // lists in step. A scan of sidecar-server-1.0.0-analytics.jar (794 classes) shows it references
        // org/apache/cassandra/{bridge,cdc/**,spark/data,spark/utils}, owned by cassandra-bridge,
        // cassandra-analytics-{cdc,cdc-codec,cdc-sidecar,common} and cassandra-avro-converter.
        ['cassandra-analytics-core',
         'cassandra-analytics-cdc',
         'cassandra-analytics-cdc-codec',
         'cassandra-analytics-cdc-sidecar',
         'cassandra-analytics-spark-converter',
         'cassandra-avro-converter',
         'cassandra-bridge'].each { module ->
            exclude(group: 'org.apache.cassandra', module: "${module}_spark3_2.12")
        }
    }
    // The local counterparts of the artifacts excluded above, so Sidecar's CDC wiring resolves against
    // the code under test. cassandra-bridge, cassandra-analytics-common and
    // cassandra-analytics-spark-converter already arrive transitively through
    // project(':cassandra-analytics-core'), which the test project depends on directly.
    api(project(':cassandra-analytics-cdc'))
    api(project(':cassandra-analytics-cdc-codec'))
    api(project(':cassandra-analytics-cdc-sidecar'))
    api(project(':cassandra-avro-converter'))
    api(group: 'org.apache.cassandra', name: 'sidecar-server-common', version: "${sidecarVersion}")
}
